name = "spin-and-speak-api"
main = "src/index.js"
compatibility_date = "2026-11-01"

[vars]
ALLOWED_ORIGINS = "https://imvikv.github.io"
GROQ_MODEL = "openai/gpt-oss-120b"
GROQ_STT_MODEL = "whisper-large-v3-turbo"
GEMINI_MODEL = "gemini-3.7-flash"
GEMINI_FALLBACK_MODEL = "gemini-3.1-flash-lite"
MODEL_TIMEOUT_MS = "12000"
DAILY_LIMIT = "300"

# Per-visitor limit: 10 AI calls per minute per IP
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"
  [ratelimits.simple]
  limit = 10
  period = 60

# Optional site-wide daily cap. Create a KV namespace, then uncomment and paste its id:
# [[kv_namespaces]]
# binding = "USAGE"
# id = "PASTE_KV_NAMESPACE_ID"

# The Gemini key is a secret, never put it here. Set it with:
#   npx wrangler secret put GROQ_API_KEY
#   npx wrangler secret put GEMINI_API_KEY   (optional backup)
